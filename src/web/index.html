<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ee" />
    <title>Fieldnote Agent</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">F</div>
        <div class="brand-copy">
          <p class="eyebrow">FIELDNOTE</p>
          <h1>調査アシスタント</h1>
        </div>
        <div class="connection" id="connection-status" aria-live="polite">
          <span class="connection-dot"></span>
          接続中
        </div>
      </header>

      <main class="conversation" id="conversation" aria-live="polite">
        <section class="welcome-card">
          <p class="eyebrow">ORCHESTRATED RESEARCH</p>
          <h2>場所を知り、旅を考え、景色を描く。</h2>
          <p>
            地質と観光の2つの専門エージェントをまとめ、解説と補助画像を届けます。
          </p>
          <div class="agent-list" aria-label="利用できるエージェント">
            <span>地質調査 Agent</span>
            <span>観光調査 Agent</span>
            <span>補助画像つき</span>
          </div>
        </section>
      </main>

      <footer class="composer-area">
        <div class="quick-prompts" aria-label="プロンプト例">
          <button type="button" data-prompt="現在地周辺の地質を調査して">現在地の地質</button>
          <button type="button" data-prompt="地質に紐づいたおすすめ観光ルートを提案して">地質×観光ルート</button>
          <button type="button" data-prompt="現在地周辺の半日観光プランを作って">近くの観光</button>
          <button type="button" data-prompt="現在地をイメージした旅のポスター画像を生成して">旅のポスター</button>
        </div>

        <form class="composer" id="message-form">
          <label class="sr-only" for="message-input">メッセージ</label>
          <textarea
            id="message-input"
            name="message"
            rows="1"
            placeholder="調査や画像生成を頼んでみる"
            autocomplete="off"
          ></textarea>
          <button class="send-button" id="send-button" type="submit" aria-label="送信">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h13M13 6l6 6-6 6" />
            </svg>
          </button>
        </form>
        <p class="send-hint">Enterで改行 · Ctrl / ⌘ + Enterで送信</p>

        <label class="context-toggle">
          <input id="location-toggle" type="checkbox" checked />
          <span class="toggle-track"><span class="toggle-knob"></span></span>
          <span>位置情報をメッセージに追加</span>
        </label>
        <p class="privacy-note">時刻とタイムゾーンは毎回追加されます。位置情報は送信時にのみ取得します。</p>
      </footer>
    </div>

    <template id="message-template">
      <article class="message">
        <div class="message-avatar"></div>
        <div class="message-body">
          <div class="message-meta"></div>
          <div class="message-content"></div>
          <div class="message-context"></div>
        </div>
      </article>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
